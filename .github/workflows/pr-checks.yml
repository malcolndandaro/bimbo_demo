name: pr-quality-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # para OIDC federation con Databricks (gated abajo)

jobs:

  # ── Ruff: lint Python ──────────────────────────────────────────────────────
  ruff:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff==0.6.9
      - name: Lint
        run: ruff check src/
      - name: Format check
        run: ruff format --check src/

  # ── sqlfluff: lint SQL ─────────────────────────────────────────────────────
  sqlfluff:
    name: sqlfluff (SQL lint, dialect=databricks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install sqlfluff
        run: pip install "sqlfluff==3.2.5"
      - name: Lint SQL
        run: sqlfluff lint sql/

  # ── databricks bundle validate ─────────────────────────────────────────────
  # Solo corre si la variable DATABRICKS_HOST está configurada en el repo.
  # Auth a Databricks vía PAT (token personal) en el workspace fevm-malcoln-aws-stable.
  #
  # Para habilitar:
  #   gh variable set DATABRICKS_HOST -b "https://fevm-malcoln-aws-stable.cloud.databricks.com"
  #   gh secret   set DATABRICKS_TOKEN -b "<PAT del workspace>"
  # El runner self-hosted debe tener IP allowlisted en el workspace (IP ACL activo).
  bundle-validate:
    name: databricks bundle validate
    # Self-hosted (MacBook): allowlisted IP for the workspace (hosted runners are IP-ACL-blocked).
    runs-on: self-hosted
    if: vars.DATABRICKS_HOST != ''
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate bundle (dev target)
        run: databricks bundle validate -t dev
      - name: Validate bundle (qa target)
        run: databricks bundle validate -t qa
      - name: Validate bundle (prd target)
        run: databricks bundle validate -t prd
