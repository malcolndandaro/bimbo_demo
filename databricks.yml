bundle:
  name: bimbo-bakery-pipeline
  uuid: 8a3e1d2a-bimbo-demo-cicd-quality-gate

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog destino, parametrizado por target.
  schema:
    description: Schema dentro del catálogo (p. ej. dev/qa/prod).
  agent_model_version:
    description: >-
      Versión del modelo UC bimbo_demo.dev.bimbops_reviewer a desplegar (config-only
      redeploy). Vacío = alias @prod. Bump + `bundle deploy` + run del job de deploy
      reapunta el endpoint a la nueva versión en sitio (sin recrear el endpoint).
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: dev

  qa:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: qa
    run_as:
      user_name: malcoln.dandaro@databricks.com   # En Bimbo: SP sp-bimbops-bakery-qa

  prd:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: prod
    run_as:
      user_name: malcoln.dandaro@databricks.com   # En Bimbo: SP sp-bimbops-bakery-prd
