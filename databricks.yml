bundle:
  name: bimbo-bakery-pipeline
  uuid: 8a3e1d2a-bimbo-demo-cicd-quality-gate

include:
  - resources/**/*.yml

variables:
  catalog:
    description: Catálogo Unity Catalog destino, parametrizado por target.
  schema:
    description: Schema dentro del catálogo (p. ej. dev/qa/prod).
  agent_model_version:
    description: >-
      Versión del modelo UC bimbo_demo.dev.bimbops_reviewer a desplegar (config-only
      redeploy). `@prod` (default) = resolver el alias @prod; un número fija esa versión.
      Bump + `bundle deploy` + run del job de deploy reapunta el endpoint en sitio.
      NO usar "" — una variable vacía serializa a un elemento null en la lista de
      Terraform y el provider hace panic (`parameters[<nil>] is not a string`).
    default: "@prod"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: dev

  qa:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: qa
    run_as:
      user_name: malcoln.dandaro@databricks.com   # En Bimbo: SP sp-bimbops-bakery-qa

  prd:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
    variables:
      catalog: bimbo_demo
      schema: prod
    run_as:
      user_name: malcoln.dandaro@databricks.com   # En Bimbo: SP sp-bimbops-bakery-prd
